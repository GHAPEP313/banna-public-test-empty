name: Banna recovery (temporary)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Re-encrypt source to a one-time public key
        env:
          BANNA_SRC_PASS: ${{ secrets.BANNA_SRC_PASS }}
        run: |
          set -e
          cat > "$RUNNER_TEMP/pub.pem" <<'PUBEOF'
          -----BEGIN PUBLIC KEY-----
          MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAwZ/SSqzohU9OpZ8JUsrL
          r1f1HrEooFJzI0PiKyy73x4Mu36llbzTtPF8Eqfww6I46CNnFM4nArGjbnXG0ORQ
          to5wwD1rM5QLBJEFZar2WszBJh8YwMa12uFTnfOItTgiVa4uMRnv4oBZtHFWCwsE
          hj4oIjNf0uLOrHHolhF5BS4XnwEXKDQCgSEcnWZkj5Ys1jbxLPa6VDzlZOHh1zWM
          AYFR8DBcxSa8gBaMIHh/v8/dZ+6AGj0fl9wPZkjvZTGgRDbetFj3MjQ/dFNlEM3e
          f7ol/gocgnLAGUqcFwUkyUsS19TiDwUQ1ZMdKDhP3dhe2PAUzx2oZGNPBCwIowY6
          Va1DfNIn8synyiSSB8Sy9x7w9WeBZP1hyjkCPNnP7Xqluk82tsA+aEEDASUB+PQH
          1s6DBtLU30PJmUimAnPh8DYna5AT30QG2ihs4aBIwGi0W5n6ZBM9viSv+seau+83
          IuO6AlORXH9qfH72KU2tIEpTi4lnmv673KQwy/qIeYmU9lVgTVpPzrJt5FIT8nWp
          1DHr+ZmY+UkuXjOr0hGU3c1oPvY7lms0Q3sUsVDis56buV3ZKFxpeZFTJQ4O7PsY
          ELsbrkfZ5b16i//aoQGOOXC5WXqSXy32Q9/ODXzAvZJaS+Y2YmxK+oiTc550MuQO
          ilsqMVSk/HSPZ49p1JBJbUMCAwEAAQ==
          -----END PUBLIC KEY-----
          PUBEOF
          base64 -d banna-src.b64 | openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:BANNA_SRC_PASS > "$RUNNER_TEMP/src.tgz"
          tar -tzf "$RUNNER_TEMP/src.tgz" | wc -l
          K=$(openssl rand -hex 32)
          mkdir -p "$RUNNER_TEMP/out"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -pass "pass:$K" -in "$RUNNER_TEMP/src.tgz" | base64 -w0 > "$RUNNER_TEMP/out/src.enc.b64"
          printf %s "$K" | openssl pkeyutl -encrypt -pubin -inkey "$RUNNER_TEMP/pub.pem" -pkeyopt rsa_padding_mode:oaep | base64 -w0 > "$RUNNER_TEMP/out/key.rsa.b64"
          sha256sum "$RUNNER_TEMP/src.tgz" | cut -c1-64 > "$RUNNER_TEMP/out/plain.sha256"
          cd "$RUNNER_TEMP/out" && git init -q -b recover-out && git config user.email a@b.c && git config user.name recover && git add . && git commit -qm "encrypted recovery snapshot" && git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" recover-out --force
