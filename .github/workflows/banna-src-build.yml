name: Banna build (unsigned)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decrypt source
        env:
          BANNA_SRC_PASS: ${{ secrets.BANNA_SRC_PASS }}
        run: |
          mkdir -p ../work && base64 -d banna-src.b64 | openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:BANNA_SRC_PASS | tar -xz -C ../work
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build unsigned release
        working-directory: ../work
        run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: banna-unsigned
          path: ../work/app/build/outputs/apk/release/*.apk
