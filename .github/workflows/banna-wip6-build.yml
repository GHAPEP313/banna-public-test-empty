name: Banna WIP6 verify and build
on:
  workflow_dispatch:
jobs:
  wip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decrypt WIP snapshot and verify checksum
        env:
          WIP_KEY_B64: ${{ secrets.BANNA_WIP_KEY }}
        run: |
          set -e
          echo "$WIP_KEY_B64" | base64 -d > "$RUNNER_TEMP/wip.pem"
          base64 -d wip6/key.rsa.b64 > "$RUNNER_TEMP/k.rsa"
          openssl pkeyutl -decrypt -inkey "$RUNNER_TEMP/wip.pem" -pkeyopt rsa_padding_mode:oaep -in "$RUNNER_TEMP/k.rsa" -out "$RUNNER_TEMP/aes.key"
          base64 -d wip6/src.enc.b64 | openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass file:"$RUNNER_TEMP/aes.key" -out "$RUNNER_TEMP/src.tgz"
          GOT=$(sha256sum "$RUNNER_TEMP/src.tgz" | cut -d' ' -f1)
          WANT=$(cat wip6/plain.sha256)
          echo "wip sha256: $GOT"
          [ "$GOT" = "$WANT" ] || { echo "::error::checksum mismatch"; exit 1; }
          mkdir -p "$RUNNER_TEMP/work" && tar -xz -f "$RUNNER_TEMP/src.tgz" -C "$RUNNER_TEMP/work"
          rm -f "$RUNNER_TEMP/wip.pem" "$RUNNER_TEMP/aes.key"
          grep -m1 -E "versionCode|versionName" "$RUNNER_TEMP/work/app/build.gradle" || true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare signing
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "::error::signing secrets missing"; exit 1; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
      - name: Build signed release
        working-directory: ${{ runner.temp }}/work
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.p12" -Pandroid.injected.signing.store.password="$KS_PASS" -Pandroid.injected.signing.key.alias="$KEY_ALIAS" -Pandroid.injected.signing.key.password="$KEY_PASS"
      - name: Verify signature (prints certificate digest only)
        run: |
          APK=$(ls "${{ runner.temp }}"/work/app/build/outputs/apk/release/*.apk | head -1)
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" > "$RUNNER_TEMP/verify.txt" 2>&1 || { echo "verify failed"; sed -n 1,5p "$RUNNER_TEMP/verify.txt" | cut -c1-120; exit 1; }
          grep "SHA-256 digest" "$RUNNER_TEMP/verify.txt" | head -1
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: banna-wip-signed
          path: ${{ runner.temp }}/work/app/build/outputs/apk/release/*.apk
