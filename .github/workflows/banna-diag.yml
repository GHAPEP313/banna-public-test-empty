name: Banna diag
on:
  workflow_dispatch:
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diag
        env:
          WIP_KEY_B64: ${{ secrets.BANNA_WIP_KEY }}
        run: |
          echo "$WIP_KEY_B64" | base64 -d > "$RUNNER_TEMP/k.pem"
          echo "FP: $(openssl rsa -in "$RUNNER_TEMP/k.pem" -pubout -outform DER 2>/dev/null | sha256sum | cut -c1-64)"
          openssl version
          for d in wip7 wip8; do
            base64 -d $d/key.rsa.b64 > "$RUNNER_TEMP/k.rsa"
            for h in sha1 sha256; do
              if openssl pkeyutl -decrypt -inkey "$RUNNER_TEMP/k.pem" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:$h -in "$RUNNER_TEMP/k.rsa" -out "$RUNNER_TEMP/o" 2>/dev/null; then echo "$d $h OK"; else echo "$d $h FAIL"; fi
            done
          done
          rm -f "$RUNNER_TEMP/k.pem" "$RUNNER_TEMP/o"
