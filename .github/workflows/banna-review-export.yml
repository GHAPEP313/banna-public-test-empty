name: Banna review export
on:
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decrypt, sanitize, scan, re-encrypt for reviewer
        env:
          WIP_KEY_B64: ${{ secrets.BANNA_WIP_KEY }}
        run: |
          set -e
          echo "$WIP_KEY_B64" | base64 -d > "$RUNNER_TEMP/wip.pem"
          base64 -d wip7/key.rsa.b64 > "$RUNNER_TEMP/k.rsa"
          openssl pkeyutl -decrypt -inkey "$RUNNER_TEMP/wip.pem" -pkeyopt rsa_padding_mode:oaep -in "$RUNNER_TEMP/k.rsa" -out "$RUNNER_TEMP/aes.key"
          base64 -d wip7/src.enc.b64 | openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass file:"$RUNNER_TEMP/aes.key" -out "$RUNNER_TEMP/src.tgz"
          GOT=$(sha256sum "$RUNNER_TEMP/src.tgz" | cut -d' ' -f1)
          [ "$GOT" = "$(cat wip7/plain.sha256)" ] || { echo "::error::checksum mismatch"; exit 1; }
          echo "baseline sha256 ok: $GOT"
          rm -f "$RUNNER_TEMP/wip.pem" "$RUNNER_TEMP/aes.key" "$RUNNER_TEMP/k.rsa"
          mkdir -p "$RUNNER_TEMP/w" && tar -xz -f "$RUNNER_TEMP/src.tgz" -C "$RUNNER_TEMP/w"
          cd "$RUNNER_TEMP/w"
          find . -type f \( -name '*.p12' -o -name '*.jks' -o -name '*.keystore' -o -name '*.pem' -o -name '*.key' -o -name '*.log' -o -name 'local.properties' -o -name '*.enc*' -o -name '*.b64' \) -delete
          rm -rf .github .gradle build app/build node_modules .git
          if grep -rIlE 'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|BEGIN (RSA |EC )?PRIVATE KEY' . > "$RUNNER_TEMP/hits.txt"; then echo "::error::secret scan hits: $(wc -l < "$RUNNER_TEMP/hits.txt") files"; exit 1; fi
          echo "files kept: $(find . -type f | wc -l)"
          find . -type f | sort > ../MANIFEST.txt; mv ../MANIFEST.txt ./MANIFEST.txt
          cd "$RUNNER_TEMP" && tar -cz -f review.tgz -C w .
          echo "" | base64 -d > pub.pem
          openssl rand -hex 32 > rk
          openssl pkeyutl -encrypt -pubin -inkey pub.pem -pkeyopt rsa_padding_mode:oaep -in rk -out rk.rsa
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -pass file:rk -in review.tgz -out review.enc
          mkdir -p out && cp rk.rsa review.enc out/
          sha256sum review.tgz | cut -d' ' -f1 > out/plain.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: banna-review-enc
          path: ${{ runner.temp }}/out/*
          retention-days: 1
